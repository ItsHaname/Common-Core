<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 960" width="960" height="960" font-family="Segoe UI, Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<defs>
<radialGradient id="bg" cx="50%" cy="50%" r="60%"><stop offset="0%" stop-color="#0d2a36"/><stop offset="100%" stop-color="#060b12"/></radialGradient>
<filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="6" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
<style>
.ring{fill:none;stroke:#8aa0ad;stroke-opacity:.35;stroke-width:1.2}
.n{stroke-width:2}
.done{fill:#0e3b45;stroke:#00babc}
.next{fill:#1d2a33;stroke:#5fd3d4;stroke-dasharray:4 3}
.locked{fill:#2a3038;stroke:#4b5560}
.t{fill:#c9d4dc;font-size:11px;text-anchor:middle;dominant-baseline:middle}
.td{fill:#00e0e2;font-size:15px;font-weight:700}
.pulse{fill:none;stroke:#00babc;stroke-width:2;animation:p 2.4s ease-out infinite;transform-origin:480px 480px}
@keyframes p{0%{opacity:.9;transform:scale(1)}100%{opacity:0;transform:scale(1.9)}}
.spin{animation:s 60s linear infinite;transform-origin:480px 480px}
@keyframes s{to{transform:rotate(360deg)}}
</style></defs>
